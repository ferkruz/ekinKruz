<div class="ek-contact-map" [class.ek-contact-map--ready]="ready()" [class.ek-contact-map--fallback]="failed()">
  <canvas #canvas class="ek-contact-map__canvas" aria-hidden="true"></canvas>
  <div class="ek-contact-map__fallback" aria-hidden="true"></div>

  <div class="ek-contact-map__legend" aria-hidden="true">
    <span>ES</span>
    <span>US</span>
    <span>AR</span>
    <span>DE</span>
  </div>
</div>
