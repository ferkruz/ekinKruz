<aside
  class="ek-soon ek-glass"
  ekReveal
  [ekRevealDelay]="120"
  [attr.aria-label]="'services.comingSoon.ariaLabel' | transloco"
>
  <div class="ek-soon__field" aria-hidden="true">
    <ek-card-scene accent="signal" />
  </div>
  <div class="ek-soon__content">
    <p class="ek-eyebrow">{{ 'common.states.inProgress' | transloco }}</p>
    <h2 class="ek-heading-md">{{ 'services.comingSoon.title' | transloco }}</h2>
    <p class="ek-body-lg">
      {{ 'services.comingSoon.description' | transloco }}
    </p>
    <div class="ek-soon__actions">
      <ek-button variant="ghost" routerLink="/portfolio">
        {{ 'common.actions.viewProjects' | transloco }}
      </ek-button>
      <ek-button variant="primary" routerLink="/contacto">
        {{ 'common.actions.scheduleMeeting' | transloco }}
      </ek-button>
    </div>
  </div>
</aside>
