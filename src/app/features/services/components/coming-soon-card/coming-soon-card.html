<aside
  class="ek-soon ek-glass"
  ekReveal
  [ekRevealDelay]="120"
  aria-label="Próximos avances"
>
  <div class="ek-soon__field" aria-hidden="true">
    <ek-card-scene accent="signal" />
  </div>
  <div class="ek-soon__content">
    <p class="ek-eyebrow">En construcción</p>
    <h2 class="ek-heading-md">Seguí explorando. Hay más en camino.</h2>
    <p class="ek-body-lg">
      Estamos ampliando continuamente nuestras capacidades y casos de éxito. Muy pronto
      incorporaremos nuevos servicios, demostraciones interactivas y proyectos destacados.
    </p>
    <div class="ek-soon__actions">
      <ek-button variant="ghost" routerLink="/portfolio">Ver proyectos</ek-button>
      <ek-button variant="primary" routerLink="/contacto">Agendar una reunión</ek-button>
    </div>
  </div>
</aside>
