<div
  class="ek-methodology-graph"
  [class.ek-methodology-graph--active]="active()"
  [class.ek-methodology-graph--strategy]="visual() === 'strategy'"
  [class.ek-methodology-graph--design]="visual() === 'design'"
  [class.ek-methodology-graph--engineering]="visual() === 'engineering'"
  [class.ek-methodology-graph--validation]="visual() === 'validation'"
  [class.ek-methodology-graph--launch]="visual() === 'launch'"
  [class.ek-methodology-graph--evolution]="visual() === 'evolution'"
>
  <div class="ek-methodology-blueprint">
    <span class="ek-methodology-blueprint__block ek-methodology-blueprint__block--one"></span>
    <span class="ek-methodology-blueprint__block ek-methodology-blueprint__block--two"></span>
    <span class="ek-methodology-blueprint__block ek-methodology-blueprint__block--three"></span>
    <span class="ek-methodology-blueprint__route ek-methodology-blueprint__route--one"></span>
    <span class="ek-methodology-blueprint__route ek-methodology-blueprint__route--two"></span>
    <span class="ek-methodology-blueprint__label">ROADMAP</span>
  </div>

  <div class="ek-methodology-ui-graph">
    <span class="ek-methodology-ui-graph__card ek-methodology-ui-graph__card--hero"></span>
    <span class="ek-methodology-ui-graph__card ek-methodology-ui-graph__card--side"></span>
    <span class="ek-methodology-ui-graph__card ek-methodology-ui-graph__card--footer"></span>
  </div>

  <div class="ek-methodology-stack-graph">
    <span class="ek-methodology-stack-graph__cube ek-methodology-stack-graph__cube--one"></span>
    <span class="ek-methodology-stack-graph__cube ek-methodology-stack-graph__cube--two"></span>
    <span class="ek-methodology-stack-graph__cube ek-methodology-stack-graph__cube--three"></span>
    <span class="ek-methodology-stack-graph__flow ek-methodology-stack-graph__flow--one"></span>
    <span class="ek-methodology-stack-graph__flow ek-methodology-stack-graph__flow--two"></span>
  </div>

  <div class="ek-methodology-qa-graph">
    <span class="ek-methodology-qa-graph__panel"></span>
    <span class="ek-methodology-qa-graph__check ek-methodology-qa-graph__check--one"></span>
    <span class="ek-methodology-qa-graph__check ek-methodology-qa-graph__check--two"></span>
    <span class="ek-methodology-qa-graph__check ek-methodology-qa-graph__check--three"></span>
  </div>

  <div class="ek-methodology-cloud-graph">
    <span class="ek-methodology-cloud-graph__cloud"></span>
    <span class="ek-methodology-cloud-graph__signal ek-methodology-cloud-graph__signal--one"></span>
    <span class="ek-methodology-cloud-graph__signal ek-methodology-cloud-graph__signal--two"></span>
    <span class="ek-methodology-cloud-graph__signal ek-methodology-cloud-graph__signal--three"></span>
  </div>

  <div class="ek-methodology-growth-graph">
    <span class="ek-methodology-growth-graph__bar ek-methodology-growth-graph__bar--one"></span>
    <span class="ek-methodology-growth-graph__bar ek-methodology-growth-graph__bar--two"></span>
    <span class="ek-methodology-growth-graph__bar ek-methodology-growth-graph__bar--three"></span>
    <span class="ek-methodology-growth-graph__node ek-methodology-growth-graph__node--one"></span>
    <span class="ek-methodology-growth-graph__node ek-methodology-growth-graph__node--two"></span>
  </div>
</div>
