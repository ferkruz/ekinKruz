<main class="ek-methodology-page" aria-labelledby="methodology-title">
  <div class="ek-methodology-page__aura" aria-hidden="true"></div>

  <ek-container [wide]="true">
    <header class="ek-methodology-page__intro" ekReveal>
      <p class="ek-eyebrow">{{ 'methodology.shared.eyebrow' | transloco }}</p>
      <h1 id="methodology-title" class="ek-display-lg">
        {{ 'methodology.page.title' | transloco }}
      </h1>
      <p class="ek-body-lg">
        {{ 'methodology.page.description' | transloco }}
      </p>
    </header>
  </ek-container>

  <ek-methodology-experience [stages]="stages"></ek-methodology-experience>
</main>
