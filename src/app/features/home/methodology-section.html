<section class="ek-methodology-strip" aria-labelledby="methodology-title">
  <ek-container [wide]="true">
    <div class="ek-methodology-strip__inner">
      <div class="ek-methodology-strip__heading">
        <p class="ek-eyebrow">{{ 'methodology.shared.eyebrow' | transloco }}</p>
        <h2 id="methodology-title" class="ek-display-lg">
          {{ 'home.methodology.title' | transloco }}
        </h2>
      </div>

      <p class="ek-body ek-methodology-strip__copy">
        {{ 'home.methodology.description' | transloco }}
      </p>
    </div>

    <div class="ek-methodology-strip__pills" [attr.aria-label]="'methodology.shared.stagesAria' | transloco">
      @for (stage of stages; track stage.index) {
        <span><strong>{{ stage.index }}</strong> {{ stage.labelKey | transloco }}</span>
      }
    </div>
  </ek-container>
</section>
