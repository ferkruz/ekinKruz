<div class="ek-language" [class.ek-language--open]="open()">
  <button
    type="button"
    class="ek-language__trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="menuId"
    [attr.aria-label]="'language.trigger' | transloco"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="ek-language__flag" aria-hidden="true">
      @switch (activeLanguage()) {
        @case ('es') {
          <svg viewBox="0 0 36 24" role="img">
            <rect width="36" height="24" rx="4" fill="#AA151B" />
            <rect y="6" width="36" height="12" fill="#F1BF00" />
            <path d="M10 8.2h3.8v7.6H10z" fill="#C60B1E" opacity="0.85" />
            <path d="M8.6 10.4h6.6v3.2H8.6z" fill="#F8D568" stroke="#8F1017" stroke-width=".5" />
          </svg>
        }
        @case ('en') {
          <svg viewBox="0 0 36 24" role="img">
            <rect width="36" height="24" rx="4" fill="#012169" />
            <path d="M0 0l36 24M36 0L0 24" stroke="#fff" stroke-width="5" />
            <path d="M0 0l36 24M36 0L0 24" stroke="#C8102E" stroke-width="2.7" />
            <path d="M18 0v24M0 12h36" stroke="#fff" stroke-width="8" />
            <path d="M18 0v24M0 12h36" stroke="#C8102E" stroke-width="4.6" />
          </svg>
        }
        @case ('eu') {
          <svg viewBox="0 0 36 24" role="img">
            <rect width="36" height="24" rx="4" fill="#D52B1E" />
            <path d="M0 0l36 24M36 0L0 24" stroke="#fff" stroke-width="5" />
            <path d="M0 0l36 24M36 0L0 24" stroke="#009B48" stroke-width="2.8" />
            <path d="M18 0v24M0 12h36" stroke="#fff" stroke-width="4.2" />
          </svg>
        }
      }
    </span>
  </button>

  @if (open()) {
    <div
      class="ek-language__menu"
      role="menu"
      [id]="menuId"
      [attr.aria-label]="'language.menuLabel' | transloco"
      (keydown)="onMenuKeydown($event)"
    >
      @for (language of languages; track language.code; let i = $index) {
        <button
          type="button"
          class="ek-language__option"
          role="menuitemradio"
          [class.ek-language__option--active]="language.code === activeLanguage()"
          [attr.aria-checked]="language.code === activeLanguage()"
          [attr.data-language-index]="i"
          (click)="selectLanguage(language.code)"
        >
          <span class="ek-language__option-flag" aria-hidden="true">
            @switch (language.code) {
              @case ('es') {
                <svg viewBox="0 0 36 24">
                  <rect width="36" height="24" rx="4" fill="#AA151B" />
                  <rect y="6" width="36" height="12" fill="#F1BF00" />
                  <path d="M10 8.2h3.8v7.6H10z" fill="#C60B1E" opacity="0.85" />
                  <path d="M8.6 10.4h6.6v3.2H8.6z" fill="#F8D568" stroke="#8F1017" stroke-width=".5" />
                </svg>
              }
              @case ('en') {
                <svg viewBox="0 0 36 24">
                  <rect width="36" height="24" rx="4" fill="#012169" />
                  <path d="M0 0l36 24M36 0L0 24" stroke="#fff" stroke-width="5" />
                  <path d="M0 0l36 24M36 0L0 24" stroke="#C8102E" stroke-width="2.7" />
                  <path d="M18 0v24M0 12h36" stroke="#fff" stroke-width="8" />
                  <path d="M18 0v24M0 12h36" stroke="#C8102E" stroke-width="4.6" />
                </svg>
              }
              @case ('eu') {
                <svg viewBox="0 0 36 24">
                  <rect width="36" height="24" rx="4" fill="#D52B1E" />
                  <path d="M0 0l36 24M36 0L0 24" stroke="#fff" stroke-width="5" />
                  <path d="M0 0l36 24M36 0L0 24" stroke="#009B48" stroke-width="2.8" />
                  <path d="M18 0v24M0 12h36" stroke="#fff" stroke-width="4.2" />
                </svg>
              }
            }
          </span>
          <span>{{ language.labelKey | transloco }}</span>
        </button>
      }
    </div>
  }
</div>
