<div
  class="ek-visual"
  [class.ek-visual--active]="active"
  [attr.data-kind]="kind"
  aria-hidden="true"
>
  @switch (kind) {
    @case ('factory') {
      <svg class="ek-visual__svg" viewBox="0 0 280 160" fill="none">
        <g class="ek-visual__nodes">
          <circle cx="40" cy="40" r="4" />
          <circle cx="120" cy="28" r="4" />
          <circle cx="200" cy="48" r="4" />
          <circle cx="70" cy="100" r="4" />
          <circle cx="150" cy="90" r="5" />
          <circle cx="230" cy="110" r="4" />
          <circle cx="100" cy="140" r="3.5" />
          <circle cx="190" cy="135" r="4" />
        </g>
        <g class="ek-visual__links">
          <path d="M40 40 L120 28 L200 48" />
          <path d="M40 40 L70 100 L150 90" />
          <path d="M120 28 L150 90 L230 110" />
          <path d="M70 100 L100 140 L190 135" />
          <path d="M150 90 L190 135" />
          <path d="M200 48 L230 110" />
        </g>
        <g class="ek-visual__blocks">
          <rect x="132" y="72" width="36" height="36" rx="4" />
          <rect x="48" y="118" width="28" height="20" rx="3" />
          <rect x="208" y="28" width="24" height="24" rx="3" />
        </g>
      </svg>
    }
    @case ('spatial') {
      <svg class="ek-visual__svg" viewBox="0 0 280 200" fill="none">
        <g class="ek-visual__iso">
          <path class="ek-visual__iso-top" d="M140 36 L210 72 L140 108 L70 72 Z" />
          <path class="ek-visual__iso-left" d="M70 72 L140 108 L140 168 L70 132 Z" />
          <path class="ek-visual__iso-right" d="M140 108 L210 72 L210 132 L140 168 Z" />
          <path class="ek-visual__iso-inner" d="M140 58 L180 78 L140 98 L100 78 Z" />
        </g>
        <g class="ek-visual__orbit">
          <ellipse cx="140" cy="110" rx="88" ry="28" />
          <circle class="ek-visual__pulse" cx="228" cy="110" r="3.5" />
        </g>
      </svg>
    }
    @case ('neural') {
      <svg class="ek-visual__svg" viewBox="0 0 280 160" fill="none">
        <g class="ek-visual__links">
          <path d="M36 40 L100 80 L36 120" />
          <path d="M100 80 L170 40" />
          <path d="M100 80 L170 80" />
          <path d="M100 80 L170 120" />
          <path d="M170 40 L244 80" />
          <path d="M170 80 L244 80" />
          <path d="M170 120 L244 80" />
        </g>
        <g class="ek-visual__nodes">
          <circle cx="36" cy="40" r="5" />
          <circle cx="36" cy="80" r="4" />
          <circle cx="36" cy="120" r="5" />
          <circle class="ek-visual__core" cx="100" cy="80" r="7" />
          <circle cx="170" cy="40" r="5" />
          <circle cx="170" cy="80" r="5" />
          <circle cx="170" cy="120" r="5" />
          <circle class="ek-visual__core" cx="244" cy="80" r="6" />
        </g>
        <circle class="ek-visual__spark" cx="100" cy="80" r="2" />
      </svg>
    }
    @case ('ux') {
      <svg class="ek-visual__svg" viewBox="0 0 280 160" fill="none">
        <g class="ek-visual__frames">
          <rect x="24" y="28" width="72" height="104" rx="8" />
          <rect x="104" y="40" width="72" height="92" rx="8" />
          <rect x="184" y="24" width="72" height="112" rx="8" />
        </g>
        <g class="ek-visual__wires">
          <path d="M60 80 H104" />
          <path d="M140 86 H184" />
        </g>
        <g class="ek-visual__ui">
          <rect x="36" y="44" width="48" height="8" rx="2" />
          <rect x="36" y="60" width="36" height="6" rx="2" />
          <rect x="36" y="74" width="48" height="28" rx="3" />
          <rect x="116" y="56" width="48" height="8" rx="2" />
          <rect x="116" y="72" width="48" height="40" rx="3" />
          <rect x="196" y="40" width="48" height="8" rx="2" />
          <rect x="196" y="56" width="32" height="6" rx="2" />
          <rect x="196" y="72" width="48" height="44" rx="3" />
        </g>
      </svg>
    }
  }
</div>
